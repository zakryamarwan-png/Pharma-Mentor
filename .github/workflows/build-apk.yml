name: Pharma Mentor APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'

      - name: Verify Android SDK
        run: |
          echo "ANDROID_HOME=$ANDROID_HOME"
          ls -la "$ANDROID_HOME"
          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          echo "Android SDK is ready."

      - name: Find and extract Pharma Mentor project
        shell: bash
        run: |
          set -e

          ZIP_NAME="PharmaMentor_V51_FULL_FIXED_READY_COMPILE_FIXED.zip"

          echo "Searching for: $ZIP_NAME"

          ZIP_PATH="$(find . -type f -name "$ZIP_NAME" -print -quit)"

          if [ -z "$ZIP_PATH" ]; then
            echo "ERROR: $ZIP_NAME was not found."
            echo "Files in repository:"
            find . -maxdepth 3 -type f | sort
            exit 1
          fi

          echo "Found ZIP:"
          echo "$ZIP_PATH"

          rm -rf extracted project
          mkdir -p extracted project

          unzip -q "$ZIP_PATH" -d extracted

          echo "Extracted files:"
          find extracted -maxdepth 4 -type f | sort | head -200

          PROJECT_DIR="$(find extracted -type f -name "settings.gradle.kts" -print -quit | xargs -r dirname)"

          if [ -z "$PROJECT_DIR" ]; then
            PROJECT_DIR="$(find extracted -type f -name "settings.gradle" -print -quit | xargs -r dirname)"
          fi

          if [ -z "$PROJECT_DIR" ]; then
            echo "ERROR: Gradle project was not found."
            find extracted -maxdepth 6 -type f | sort
            exit 1
          fi

          echo "Gradle project found at:"
          echo "$PROJECT_DIR"

          cp -a "$PROJECT_DIR"/. project/

          echo "Project verification:"
          test -f project/settings.gradle.kts || test -f project/settings.gradle
          test -f project/build.gradle.kts || test -f project/build.gradle

          echo "Project copied successfully."

      - name: Force Kotlin 1.9.24 compatibility
        shell: bash
        working-directory: project
        run: |
          set -e

          if [ -f build.gradle.kts ]; then
            sed -i 's/id("org.jetbrains.kotlin.android") version "[^"]*" apply false/id("org.jetbrains.kotlin.android") version "1.9.24" apply false/' build.gradle.kts
          fi

          echo "Root build.gradle.kts:"
          cat build.gradle.kts || true

      - name: Make Gradle executable
        working-directory: project
        run: |
          chmod +x gradlew || true

      - name: Build Debug APK
        working-directory: project
        run: |
          set -e

          if [ -f ./gradlew ]; then
            ./gradlew clean assembleDebug --stacktrace
          else
            gradle clean assembleDebug --stacktrace
          fi

      - name: Find APK
        working-directory: project
        run: |
          echo "APK files:"
          find . -type f -name "*.apk" -print

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Pharma-Mentor-debug-apk
          path: |
            project/**/build/outputs/apk/debug/*.apk
          if-no-files-found: error
