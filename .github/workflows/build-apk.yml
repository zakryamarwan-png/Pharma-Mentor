name: Pharma Mentor APK Build

on:
workflow_dispatch:
push:
branches:
- main

permissions:
contents: read

jobs:
build:
runs-on: ubuntu-latest

env:
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  ANDROID_HOME: /usr/local/lib/android/sdk

steps:
  - name: Checkout repository
    uses: actions/checkout@v4

  - name: Extract Pharma Mentor source
    shell: bash
    run: |
      set -e

      mkdir -p project

      unzip -q PharmaMentor_V51_CLEAN_FIXED.zip -d project

      cp -R project/. .
      rm -rf project

      chmod +x gradlew
      chmod +x tools/*.sh || true

  - name: Setup Java 17
    uses: actions/setup-java@v4
    with:
      distribution: temurin
      java-version: '17'

  - name: Prepare Android SDK
    shell: bash
    run: |
      set -e

      echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"
      echo "ANDROID_HOME=$ANDROID_HOME"

      export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

      yes | sdkmanager --licenses >/dev/null || true

      sdkmanager --sdk_root="$ANDROID_SDK_ROOT" --install \
        "platform-tools" \
        "platforms;android-35" \
        "build-tools;35.0.0"

  - name: Verify Android SDK
    shell: bash
    run: |
      set -e

      export PATH="$ANDROID_SDK_ROOT/cmdline-tools/latest/bin:$ANDROID_SDK_ROOT/platform-tools:$PATH"

      sdkmanager --version
      java -version

      test -d "$ANDROID_SDK_ROOT/platforms/android-35"
      test -d "$ANDROID_SDK_ROOT/build-tools/35.0.0"

      echo "Android SDK is ready."

  - name: Setup Gradle
    uses: gradle/actions/setup-gradle@v4

  - name: Fix JVM target compatibility
    shell: bash
    run: |
      set -e

      printf '%s\n' \
        'allprojects {' \
        '    tasks.withType(JavaCompile).configureEach {' \
        '        options.release = 17' \
        '    }' \
        '    tasks.withType(org.jetbrains.kotlin.gradle.tasks.KotlinCompile).configureEach {' \
        '        kotlinOptions.jvmTarget = "17"' \
        '    }' \
        '}' \
        > jvm-fix.gradle

  - name: Build Debug APK
    shell: bash
    run: |
      set -e

      ./gradlew \
        -I jvm-fix.gradle \
        --no-daemon \
        --stacktrace \
        :app:assembleDebug

  - name: Verify APK
    shell: bash
    run: |
      set -e

      ls -lh app/build/outputs/apk/debug/

      test -f app/build/outputs/apk/debug/app-debug.apk

      echo "APK created successfully."

  - name: Upload Debug APK
    uses: actions/upload-artifact@v4
    with:
      name: pharma-mentor-debug-apk
      path: app/build/outputs/apk/debug/app-debug.apk
      if-no-files-found: error
