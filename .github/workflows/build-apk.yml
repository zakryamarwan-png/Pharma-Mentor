name: Pharma Mentor APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.10
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK components
        shell: bash
        run: |
          set -e
          yes | sdkmanager --licenses >/dev/null
          sdkmanager --install "platform-tools" "platforms;android-35" "build-tools;35.0.0"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

          echo "Android SDK 35 is ready."

      - name: Extract Pharma Mentor source
        shell: bash
        run: |
          set -e

          rm -rf extracted project
          mkdir -p extracted project

          ZIP="$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)"

          if [ -z "$ZIP" ]; then
            echo "ERROR: No ZIP source file found in repository root."
            exit 1
          fi

          echo "Using source archive: $ZIP"

          unzip -q "$ZIP" -d extracted

          ROOT="$(dirname "$(find extracted -type f -name 'settings.gradle.kts' | head -n 1)")"

          if [ -z "$ROOT" ] || [ ! -f "$ROOT/settings.gradle.kts" ]; then
            echo "ERROR: Gradle project root was not found."
            find extracted -maxdepth 4 -type f | head -100
            exit 1
          fi

          echo "Gradle project root: $ROOT"

          cp -R "$ROOT"/. project/

      - name: Verify Gradle project
        shell: bash
        run: |
          set -e

          cd project

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/pharmamentor/app/MainActivity.kt

          echo "Gradle project verification passed."
          echo "MainActivity lines:"
          wc -l app/src/main/java/com/pharmamentor/app/MainActivity.kt

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd project
          gradle --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="project/app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "APK created successfully:"
          ls -lh "$APK"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pharma-mentor-v51-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
