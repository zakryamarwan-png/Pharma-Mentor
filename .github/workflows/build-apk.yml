name: Pharma Mentor APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    name: Build Pharma Mentor APK
    runs-on: ubuntu-latest

    steps:

      # 1. Download repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Gradle
      - name: Setup Gradle 8.10
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'

      # 4. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4
        with:
          packages: ''

      # 5. Install required Android SDK packages
      - name: Install Android SDK components
        shell: bash
        run: |
          set -e

          echo "Android SDK:"
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

          echo "Accepting Android SDK licenses..."
          yes | sdkmanager --licenses >/dev/null || true

          echo "Installing Android SDK 35..."
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK installation completed."

      # 6. Verify Android SDK
      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          echo "Checking Android SDK..."

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

          echo "Android SDK 35: OK"
          echo "Build Tools 35.0.0: OK"

          sdkmanager --list_installed | grep -E \
            "platform-tools|platforms;android-35|build-tools;35.0.0" || true

      # 7. Find source ZIP
      - name: Find Pharma Mentor source
        shell: bash
        run: |
          set -e

          echo "Files in repository root:"
          ls -lah

          ZIP=""

          if [ -f "PharmaMentor_V51_FULL_FIXED_READY.zip" ]; then
            ZIP="PharmaMentor_V51_FULL_FIXED_READY.zip"
          else
            ZIP="$(find . -maxdepth 1 -type f -name '*.zip' | head -n 1)"
          fi

          if [ -z "$ZIP" ]; then
            echo "ERROR: No Pharma Mentor ZIP file found."
            exit 1
          fi

          echo "SOURCE_ZIP=$ZIP" >> "$GITHUB_ENV"
          echo "Using source ZIP: $ZIP"

      # 8. Extract project
      - name: Extract Pharma Mentor source
        shell: bash
        run: |
          set -e

          rm -rf extracted project
          mkdir -p extracted project

          echo "Extracting:"
          echo "$SOURCE_ZIP"

          unzip -q "$SOURCE_ZIP" -d extracted

          echo "Searching for Gradle project..."

          ROOT="$(dirname "$(find extracted -type f -name 'settings.gradle.kts' | head -n 1)")"

          if [ -z "$ROOT" ] || [ ! -f "$ROOT/settings.gradle.kts" ]; then
            echo "ERROR: Gradle project root was not found."

            echo "Extracted files:"
            find extracted -maxdepth 5 -type f | head -200

            exit 1
          fi

          echo "Gradle project root:"
          echo "$ROOT"

          cp -R "$ROOT"/. project/

      # 9. Verify project
      - name: Verify Gradle project
        shell: bash
        run: |
          set -e

          cd project

          echo "Project files:"
          ls -lah

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/pharmamentor/app/MainActivity.kt

          echo ""
          echo "Gradle project verification PASSED."

          echo ""
          echo "MainActivity:"
          wc -l app/src/main/java/com/pharmamentor/app/MainActivity.kt

      # 10. Check Java and Gradle
      - name: Verify Java and Gradle
        shell: bash
        run: |
          set -e

          echo "Java:"
          java -version

          echo ""
          echo "Gradle:"
          gradle --version

      # 11. Clean project
      - name: Clean Gradle project
        shell: bash
        run: |
          set -e

          cd project

          gradle --no-daemon clean

      # 12. Build Debug APK
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd project

          echo "Starting Pharma Mentor Debug APK build..."

          gradle \
            --no-daemon \
            --stacktrace \
            --info \
            :app:assembleDebug

      # 13. Verify APK
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="project/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."

            echo "Searching build directory:"
            find project/app/build -type f 2>/dev/null | head -200 || true

            exit 1
          fi

          echo ""
          echo "======================================"
          echo "APK CREATED SUCCESSFULLY"
          echo "======================================"

          ls -lh "$APK"

      # 14. Upload APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pharma-mentor-v51-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # 15. Upload build reports if build fails
      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pharma-mentor-v51-build-reports
          path: |
            project/app/build/reports/**
            project/app/build/outputs/logs/**
          if-no-files-found: ignore
