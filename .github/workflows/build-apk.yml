name: PharmaMentor V51 CI/CD Pipeline

on:
  push:
    branches: [ "main", "master" ]
  pull_request:
    branches: [ "main", "master" ]
  workflow_dispatch: # يتيح تشغيل البناء يدوياً بضغطة زر من الهاتف

jobs:
  build:
    name: Build & Export APKs
    runs-on: ubuntu-latest

    steps:
      # 1. جلب شفرة المشروع الكاملة
      - name: Checkout Code
        uses: actions/checkout@v4

      # 2. إعداد بيئة Java (JDK 17) وتفعيل تسريع Gradle
      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          java-version: '17'
          distribution: 'temurin'
          cache: gradle

      # 3. منح صلاحيات التنفيذ لملف gradlew (تفادي أخطاء الصلاحيات)
      - name: Grant Execute Permission for Gradlew
        run: chmod +x gradlew

      # 4. تجميع نسخة التجربة (Debug APK)
      - name: Build Debug APK
        run: ./gradlew assembleDebug --stacktrace

      # 5. تجميع نسخة الإنتاج (Release APK)
      - name: Build Release APK
        run: ./gradlew assembleRelease --stacktrace

      # 6. رفع ملف الـ Debug APK للتحميل
      - name: Upload Debug APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PharmaMentor-V51-Debug-APK
          path: app/build/outputs/apk/debug/*.apk
          retention-days: 14

      # 7. رفع ملف الـ Release APK للتحميل
      - name: Upload Release APK Artifact
        uses: actions/upload-artifact@v4
        if: always()
        with:
          name: PharmaMentor-V51-Release-APK
          path: app/build/outputs/apk/release/*.apk
          retention-days: 30

