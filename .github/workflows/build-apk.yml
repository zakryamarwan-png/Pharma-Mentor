name: Pharma Mentor APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    runs-on: ubuntu-latest

    steps:

      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Gradle 8.10
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install Android SDK
        shell: bash
        run: |
          set -e

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

          echo "Android SDK 35 is ready."

      - name: Select Pharma Mentor source
        shell: bash
        run: |
          set -e

          ZIP="./PharmaMentor_V51_FULL_FIXED_READY.zip"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: Source ZIP not found:"
            echo "$ZIP"
            echo
            echo "Available ZIP files:"
            find . -maxdepth 1 -type f -name "*.zip" -print
            exit 1
          fi

          echo "Using:"
          echo "$ZIP"

      - name: Extract source
        shell: bash
        run: |
          set -e

          rm -rf extracted project
          mkdir -p extracted project

          unzip -q \
            "./PharmaMentor_V51_FULL_FIXED_READY.zip" \
            -d extracted

          ROOT="$(dirname "$(find extracted \
            -type f \
            -name 'settings.gradle.kts' \
            | head -n 1)")"

          if [ -z "$ROOT" ]; then
            echo "ERROR: Gradle project root not found."
            exit 1
          fi

          echo "Project root:"
          echo "$ROOT"

          cp -R "$ROOT"/. project/

      - name: Verify project
        shell: bash
        run: |
          set -e

          cd project

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/pharmamentor/app/MainActivity.kt

          echo "Project verification passed."

          echo
          echo "MainActivity:"
          wc -l app/src/main/java/com/pharmamentor/app/MainActivity.kt

          echo
          echo "Kotlin files:"
          find app/src/main/java -type f -name "*.kt" | sort

      - name: Verify critical source files
        shell: bash
        run: |
          set -e

          cd project

          test -f \
            app/src/main/java/com/pharmamentor/app/MainActivity.kt

          test -f \
            app/src/main/java/com/pharmamentor/app/data/AdaptiveSessionEngine.kt

          echo "Critical source files exist."

      - name: Kotlin source diagnostics
        shell: bash
        run: |
          set -e

          cd project

          echo "======================================"
          echo "KOTLIN SOURCE DIAGNOSTICS"
          echo "======================================"

          echo
          echo "MainActivity.kt:"
          grep -n \
            "suspend\|lifecycleScope\|LayoutParams\|tutorAttempts" \
            app/src/main/java/com/pharmamentor/app/MainActivity.kt \
            || true

          echo
          echo "AdaptiveSessionEngine.kt:"
          sed -n '1,100p' \
            app/src/main/java/com/pharmamentor/app/data/AdaptiveSessionEngine.kt

          echo
          echo "======================================"
          echo "END DIAGNOSTICS"
          echo "======================================"

      - name: Clean previous build
        shell: bash
        run: |
          set -e

          cd project

          gradle --no-daemon clean

      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd project

          gradle \
            --no-daemon \
            --stacktrace \
            --warning-mode all \
            :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="project/app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."
            exit 1
          fi

          echo
          echo "======================================"
          echo "APK CREATED SUCCESSFULLY"
          echo "======================================"

          ls -lh "$APK"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: pharma-mentor-v51-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
