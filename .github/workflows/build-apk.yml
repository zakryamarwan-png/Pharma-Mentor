name: Pharma Mentor APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    name: Build Pharma Mentor APK
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout repository
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Setup Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Setup Gradle
      - name: Setup Gradle 8.10
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'

      # 4. Setup Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 5. Install Android SDK
      - name: Install Android SDK components
        shell: bash
        run: |
          set -e

          echo "Accepting Android SDK licenses..."
          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          echo "Installing required Android SDK packages..."
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # 6. Verify Android SDK
      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

          echo "Android SDK 35: OK"
          echo "Build Tools 35.0.0: OK"

      # 7. Locate exact source ZIP
      - name: Locate Pharma Mentor source
        shell: bash
        run: |
          set -e

          ZIP="PharmaMentor_V51_FULL_FIXED_READY.zip"

          echo "Looking for: $ZIP"

          if [ ! -f "$ZIP" ]; then
            echo "ERROR: $ZIP was not found."
            echo ""
            echo "ZIP files available in repository:"
            find . -maxdepth 1 -type f -name "*.zip" -print
            exit 1
          fi

          echo "SOURCE ZIP FOUND:"
          ls -lh "$ZIP"

          echo "SOURCE_ZIP=$ZIP" >> "$GITHUB_ENV"

      # 8. Extract source ZIP
      - name: Extract Pharma Mentor source
        shell: bash
        run: |
          set -e

          rm -rf extracted project
          mkdir -p extracted project

          echo "Extracting $SOURCE_ZIP ..."

          unzip -q "$SOURCE_ZIP" -d extracted

          echo "Searching for Gradle project..."

          ROOT="$(dirname "$(find extracted \
            -type f \
            -name 'settings.gradle.kts' \
            -print -quit)")"

          if [ -z "$ROOT" ] || [ ! -f "$ROOT/settings.gradle.kts" ]; then
            echo "ERROR: Gradle project root was not found."

            echo "Extracted files:"
            find extracted -maxdepth 6 -type f | head -300

            exit 1
          fi

          echo "Gradle project found at:"
          echo "$ROOT"

          cp -R "$ROOT"/. project/

      # 9. Verify project
      - name: Verify Gradle project
        shell: bash
        run: |
          set -e

          cd project

          echo "Checking Gradle project..."

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml
          test -f app/src/main/java/com/pharmamentor/app/MainActivity.kt

          echo ""
          echo "Gradle project verification PASSED"

      # 10. Show project information
      - name: Show project information
        shell: bash
        run: |
          set -e

          cd project

          echo "========================================"
          echo "PROJECT INFORMATION"
          echo "========================================"

          echo "Gradle:"
          gradle --version

          echo ""
          echo "Java:"
          java -version

          echo ""
          echo "MainActivity:"
          wc -l app/src/main/java/com/pharmamentor/app/MainActivity.kt

          echo ""
          echo "========================================"

      # 11. Clean project
      - name: Clean project
        shell: bash
        run: |
          set -e

          cd project

          echo "Cleaning project..."

          gradle \
            --no-daemon \
            clean

      # 12. Build Debug APK + Build Scan
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd project

          echo "========================================"
          echo "BUILDING PHARMA MENTOR APK"
          echo "========================================"

          gradle \
            --no-daemon \
            --stacktrace \
            --scan \
            :app:assembleDebug

      # 13. Verify APK
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="project/app/build/outputs/apk/debug/app-debug.apk"

          echo "========================================"
          echo "VERIFYING APK"
          echo "========================================"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not created."

            echo ""
            echo "Available build files:"
            find project/app/build -type f 2>/dev/null | head -300 || true

            exit 1
          fi

          echo ""
          echo "APK CREATED SUCCESSFULLY:"
          ls -lh "$APK"

      # 14. Upload APK
      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pharma-mentor-v51-debug-apk
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 30

      # 15. Upload build reports if failed
      - name: Upload build reports
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: pharma-mentor-v51-build-reports
          path: |
            project/app/build/reports/**
            project/app/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 14
