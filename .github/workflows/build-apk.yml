name: Pharma Mentor APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build Pharma Mentor
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle
        uses: gradle/actions/setup-gradle@v6

      - name: Set up Android SDK
        uses: android-actions/setup-android@v4

      - name: Verify Android SDK
        run: |
          sdkmanager --list_installed | head -100
          echo "ANDROID_HOME=$ANDROID_HOME"
          echo "ANDROID_SDK_ROOT=$ANDROID_SDK_ROOT"

      - name: Make Gradle executable
        run: |
          chmod +x ./gradlew

      - name: Verify project structure
        run: |
          echo "=== Root ==="
          ls -la
          echo "=== App ==="
          ls -la app
          echo "=== Kotlin files ==="
          find app/src -type f \( -name "*.kt" -o -name "*.java" \) | sort

      - name: Verify Room entities
        run: |
          echo "=== Room database/entity files ==="
          find app/src -type f \( -name "*.kt" -o -name "*.java" \) \
            | grep -Ei 'database|entity|dao|room' || true

          echo "=== Entity annotations ==="
          grep -R -n '@Entity' app/src/main/java app/src/main/kotlin 2>/dev/null || true

          echo "=== Database annotations ==="
          grep -R -n '@Database' app/src/main/java app/src/main/kotlin 2>/dev/null || true

          echo "=== Room version references ==="
          grep -R -n 'version *=\|version=' app/src/main/java app/src/main/kotlin 2>/dev/null \
            | grep -Ei 'Database|Room|version' || true

          echo "Room source verification completed."

      - name: Clean
        run: |
          ./gradlew --no-daemon clean

      - name: Compile Kotlin
        run: |
          ./gradlew --no-daemon --stacktrace :app:compileDebugKotlin

      - name: Run KAPT
        run: |
          ./gradlew --no-daemon --stacktrace :app:kaptDebugKotlin

      - name: Build Debug APK
        run: |
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Check APK
        run: |
          echo "=== APK files ==="
          find app/build/outputs/apk -type f -maxdepth 5 -print
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pharma-Mentor-V51-Debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
