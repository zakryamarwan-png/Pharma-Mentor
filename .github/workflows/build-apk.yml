name: Pharma Mentor APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Extract Pharma Mentor source
        shell: bash
        run: |
          set -e
          mkdir -p project
          unzip -q PharmaMentor_source_bundle.zip -d project
          cp -R project/. .
          rm -rf project
          chmod +x gradlew
          chmod +x tools/*.sh || true

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      - name: Install Android SDK packages
        shell: bash
        run: |
          set -e
          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v4

      - name: Configure JVM 17
        shell: bash
        run: |
          set -e

          python3 - <<'PY'
          from pathlib import Path

          files = [
              Path("app/build.gradle"),
              Path("app/build.gradle.kts")
          ]

          for p in files:
              if not p.exists():
                  continue

              text = p.read_text()

              # Configure Java 17
              if "compileOptions" not in text and "android {" in text:
                  text = text.replace(
                      "android {",
                      """android {

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }""",
                      1
                  )

              # Configure Kotlin JVM 17
              if "kotlinOptions" not in text:
                  text += """

kotlinOptions {
    jvmTarget = "17"
}
"""

              p.write_text(text)

              print(f"Configured JVM 17: {p}")

          PY

      - name: Verify JVM configuration
        shell: bash
        run: |
          echo "Java version:"
          java -version

          echo ""
          echo "Gradle version:"
          ./gradlew --version

          echo ""
          echo "Checking Android build files:"
          find app -maxdepth 2 -type f \( -name "build.gradle" -o -name "build.gradle.kts" \) -print

      - name: Build Debug APK
        shell: bash
        run: |
          set -e
          ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Verify APK
        shell: bash
        run: |
          set -e
          ls -lh app/build/outputs/apk/debug/
          test -f app/build/outputs/apk/debug/app-debug.apk

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: pharma-mentor-debug-apk
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
