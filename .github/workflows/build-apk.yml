name: Pharma Mentor APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

jobs:
  build:
    name: Build and Verify Pharma Mentor
    runs-on: ubuntu-latest

    steps:
      # --------------------------------------------------
      # 1. Checkout
      # --------------------------------------------------
      - name: Checkout repository
        uses: actions/checkout@v4

      # --------------------------------------------------
      # 2. Java 17
      # --------------------------------------------------
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # --------------------------------------------------
      # 3. Android SDK
      # --------------------------------------------------
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # --------------------------------------------------
      # 4. Install required Android SDK packages
      # --------------------------------------------------
      - name: Install Android SDK packages
        run: |
          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

      # --------------------------------------------------
      # 5. Verify project structure
      # --------------------------------------------------
      - name: Verify Android project
        shell: bash
        run: |
          set -e

          echo "=== Repository ==="
          pwd
          ls -la

          echo "=== Required files ==="

          test -f settings.gradle.kts
          test -f build.gradle.kts
          test -f gradle.properties
          test -f app/build.gradle.kts
          test -f app/src/main/AndroidManifest.xml

          echo "Gradle project files: OK"

          echo "=== App source ==="
          test -d app/src/main/java
          echo "Java/Kotlin source directory: OK"

      # --------------------------------------------------
      # 6. Verify Room entities
      # --------------------------------------------------
      - name: Verify Room entities
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "        ROOM ENTITY VERIFICATION"
          echo "========================================"

          ENTITY_COUNT=$(grep -R "@Entity" app/src/main/java app/src/main/kotlin 2>/dev/null \
            | grep -v "import " \
            | wc -l || true)

          PRIMARY_KEY_COUNT=$(grep -R "@PrimaryKey" app/src/main/java app/src/main/kotlin 2>/dev/null \
            | grep -v "import " \
            | wc -l || true)

          DATABASE_COUNT=$(grep -R "@Database" app/src/main/java app/src/main/kotlin 2>/dev/null \
            | grep -v "import " \
            | wc -l || true)

          echo "Room @Entity count:     $ENTITY_COUNT"
          echo "Room @PrimaryKey count: $PRIMARY_KEY_COUNT"
          echo "Room @Database count:   $DATABASE_COUNT"

          if [ "$ENTITY_COUNT" -eq 0 ]; then
            echo "ERROR: No Room @Entity found."
            exit 1
          fi

          if [ "$DATABASE_COUNT" -eq 0 ]; then
            echo "ERROR: No Room @Database found."
            exit 1
          fi

          if [ "$PRIMARY_KEY_COUNT" -lt "$ENTITY_COUNT" ]; then
            echo "ERROR: Some Room entities appear to have no @PrimaryKey."
            echo "Every Room entity must define a primary key."
            exit 1
          fi

          echo "Basic Room entity verification: PASSED"

      # --------------------------------------------------
      # 7. Verify Room database version
      # --------------------------------------------------
      - name: Verify Room database configuration
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "        ROOM DATABASE CONFIG"
          echo "========================================"

          grep -R -n "@Database" app/src/main/java app/src/main/kotlin 2>/dev/null || true
          grep -R -n "version[[:space:]]*=" app/src/main/java app/src/main/kotlin 2>/dev/null || true

          echo "Room database configuration inspected."

      # --------------------------------------------------
      # 8. Verify Gradle wrapper
      # --------------------------------------------------
      - name: Verify Gradle wrapper
        shell: bash
        run: |
          set -e

          test -f gradlew

          chmod +x gradlew

          ./gradlew --version

      # --------------------------------------------------
      # 9. Clean
      # --------------------------------------------------
      - name: Gradle clean
        run: |
          ./gradlew --no-daemon clean

      # --------------------------------------------------
      # 10. KAPT / Room compilation
      # --------------------------------------------------
      - name: Verify Room compilation
        shell: bash
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:kaptDebugKotlin

      # --------------------------------------------------
      # 11. Kotlin compilation
      # --------------------------------------------------
      - name: Compile Kotlin
        shell: bash
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:compileDebugKotlin

      # --------------------------------------------------
      # 12. Build Debug APK
      # --------------------------------------------------
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          ./gradlew \
            --no-daemon \
            --stacktrace \
            :app:assembleDebug

      # --------------------------------------------------
      # 13. Verify APK
      # --------------------------------------------------
      - name: Verify APK
        shell: bash
        run: |
          set -e

          APK="app/build/outputs/apk/debug/app-debug.apk"

          test -f "$APK"

          echo "========================================"
          echo "              APK SUCCESS"
          echo "========================================"

          ls -lh "$APK"

      # --------------------------------------------------
      # 14. Upload APK
      # --------------------------------------------------
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: Pharma-Mentor-debug
          path: app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error

      # --------------------------------------------------
      # 15. Upload Room schemas if generated
      # --------------------------------------------------
      - name: Upload Room schemas
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Pharma-Mentor-room-schemas
          path: |
            app/schemas/**
            schemas/**
          if-no-files-found: ignore
