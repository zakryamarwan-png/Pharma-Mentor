name: Pharma Mentor APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk
  GRADLE_VERSION: "8.10"

jobs:
  build:
    name: Build Pharma Mentor APK
    runs-on: ubuntu-latest

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"
          cache: gradle

      - name: Setup Gradle
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: ${{ env.GRADLE_VERSION }}

      - name: Setup Android SDK
        shell: bash
        run: |
          set -euo pipefail
          export PATH="$ANDROID_HOME/cmdline-tools/latest/bin:$ANDROID_HOME/platform-tools:$PATH"

          echo "ANDROID_HOME=$ANDROID_HOME"
          java -version
          gradle --version

          yes | sdkmanager --licenses >/dev/null || true
          sdkmanager \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"
          echo "Android SDK is ready."

      - name: Locate and extract Android project
        shell: bash
        run: |
          set -euo pipefail

          rm -rf extracted candidate project
          mkdir -p extracted candidate project

          mapfile -t ZIPS < <(find . -type f -iname '*.zip' -not -path './.git/*' | sort)

          if [ "${#ZIPS[@]}" -eq 0 ]; then
            echo "ERROR: No ZIP project file was found."
            find . -maxdepth 4 -type f | sort | sed -n '1,250p'
            exit 1
          fi

          SELECTED=""

          for ZIP in "${ZIPS[@]}"; do
            echo "----------------------------------------"
            echo "Checking ZIP: $ZIP"

            if ! unzip -t "$ZIP" >/tmp/ziptest.log 2>&1; then
              echo "Skipping invalid ZIP: $ZIP"
              sed -n '1,40p' /tmp/ziptest.log || true
              continue
            fi

            rm -rf candidate
            mkdir -p candidate

            if ! unzip -q "$ZIP" -d candidate; then
              echo "Skipping ZIP because extraction failed: $ZIP"
              continue
            fi

            SETTINGS_FILE="$(find candidate -type f \( -name 'settings.gradle.kts' -o -name 'settings.gradle' \) -print -quit || true)"

            if [ -n "$SETTINGS_FILE" ]; then
              PROJECT_ROOT="$(dirname "$SETTINGS_FILE")"
              echo "Found Gradle project: $PROJECT_ROOT"

              cp -a "$PROJECT_ROOT"/. project/
              SELECTED="$ZIP"
              echo "Selected project ZIP: $SELECTED"
              break
            fi

            echo "No Gradle project found inside: $ZIP"
          done

          if [ -z "$SELECTED" ]; then
            echo "ERROR: No valid Android Gradle project ZIP was found."
            echo "Available ZIP files:"
            printf '%s\n' "${ZIPS[@]}"
            exit 1
          fi

          echo "Project extracted successfully."
          find project -maxdepth 3 -type f \( \
            -name 'settings.gradle.kts' -o \
            -name 'settings.gradle' -o \
            -name 'build.gradle.kts' -o \
            -name 'build.gradle' \
          \) -print | sort

      - name: Overlay standalone MainActivity.kt if present
        shell: bash
        run: |
          set -euo pipefail

          MAIN_FILE="$(find . -maxdepth 4 -type f -name 'MainActivity.kt' \
            -not -path './project/*' \
            -not -path './extracted/*' \
            -not -path './candidate/*' \
            -not -path './.git/*' \
            -print -quit || true)"

          if [ -n "$MAIN_FILE" ]; then
            echo "Standalone MainActivity.kt found: $MAIN_FILE"
            mkdir -p project/app/src/main/java/com/pharmamentor/app
            cp "$MAIN_FILE" project/app/src/main/java/com/pharmamentor/app/MainActivity.kt
            echo "MainActivity.kt copied into the Android project."
          else
            echo "No standalone MainActivity.kt found; using the file from the project ZIP."
          fi

      - name: Verify Gradle project
        shell: bash
        run: |
          set -euo pipefail

          test -f project/settings.gradle.kts || test -f project/settings.gradle
          test -f project/build.gradle.kts || test -f project/build.gradle
          test -d project/app
          test -f project/app/src/main/java/com/pharmamentor/app/MainActivity.kt

          echo "Gradle project verification passed."
          echo "MainActivity.kt:" 
          wc -l project/app/src/main/java/com/pharmamentor/app/MainActivity.kt

          echo "Project root contents:"
          ls -la project

      - name: Build Debug APK
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail
          gradle --no-daemon --stacktrace --warning-mode all :app:assembleDebug

      - name: Locate APK
        id: apk
        working-directory: project
        shell: bash
        run: |
          set -euo pipefail

          APK="$(find app/build/outputs/apk/debug -maxdepth 1 -type f -name '*.apk' -print -quit || true)"

          if [ -z "$APK" ]; then
            echo "ERROR: Debug APK was not created."
            find app/build/outputs -maxdepth 5 -type f 2>/dev/null | sort || true
            exit 1
          fi

          echo "APK created: $APK"
          echo "path=$APK" >> "$GITHUB_OUTPUT"

      - name: Upload Debug APK
        uses: actions/upload-artifact@v4
        with:
          name: Pharma-Mentor-debug-apk
          path: project/${{ steps.apk.outputs.path }}
          if-no-files-found: error
          retention-days: 14

      - name: Upload build reports if build fails
        if: failure()
        uses: actions/upload-artifact@v4
        with:
          name: Pharma-Mentor-build-reports
          path: |
            project/**/build/reports/**
            project/**/build/outputs/logs/**
          if-no-files-found: ignore
          retention-days: 7
