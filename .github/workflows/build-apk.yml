name: Pharma Mentor APK Build

on:
  workflow_dispatch:
  push:
    branches:
      - main

permissions:
  contents: read

env:
  ANDROID_HOME: /usr/local/lib/android/sdk
  ANDROID_SDK_ROOT: /usr/local/lib/android/sdk

jobs:
  build:
    name: Build Pharma Mentor APK
    runs-on: ubuntu-latest

    steps:

      # 1. Checkout
      - name: Checkout repository
        uses: actions/checkout@v4

      # 2. Java 17
      - name: Setup Java 17
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '17'

      # 3. Gradle 8.10
      - name: Setup Gradle 8.10
        uses: gradle/actions/setup-gradle@v6
        with:
          gradle-version: '8.10'

      # 4. Android SDK
      - name: Setup Android SDK
        uses: android-actions/setup-android@v4

      # 5. Install SDK
      - name: Install Android SDK components
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "ANDROID SDK SETUP"
          echo "========================================"

          yes | sdkmanager --licenses >/dev/null 2>&1 || true

          sdkmanager --install \
            "platform-tools" \
            "platforms;android-35" \
            "build-tools;35.0.0"

          echo "Android SDK installation: OK"

      # 6. Verify SDK
      - name: Verify Android SDK
        shell: bash
        run: |
          set -e

          test -d "$ANDROID_HOME/platforms/android-35"
          test -d "$ANDROID_HOME/build-tools/35.0.0"

          echo "Android SDK 35: OK"
          echo "Build Tools 35.0.0: OK"

      # 7. Locate source project or ZIP
      - name: Locate source project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "LOCATING PHARMA MENTOR PROJECT"
          echo "========================================"

          # If the repository already contains the Gradle project,
          # use it directly.
          if [ -f "settings.gradle.kts" ] || [ -f "settings.gradle" ]; then
            echo "Gradle project found directly in repository root."
            echo "BUILD_SOURCE=ROOT" >> "$GITHUB_ENV"
            exit 0
          fi

          # Otherwise search for a supported source ZIP.
          ZIP=""

          for candidate in \
            "PharmaMentor_V51_DRUG_LIBRARY_588_FINAL_BUILD_FIXED.zip" \
            "PharmaMentor_V51_DRUG_LIBRARY_588_BUILD_FIXED.zip" \
            "PharmaMentor_V51_FULL_FIXED_READY.zip" \
            "PharmaMentor_source_bundle.zip"
          do
            if [ -f "$candidate" ]; then
              ZIP="$candidate"
              break
            fi
          done

          if [ -z "$ZIP" ]; then
            echo "ERROR: No Gradle project or supported source ZIP found."
            echo ""
            echo "Repository root:"
            ls -lah
            echo ""
            echo "ZIP files:"
            find . -maxdepth 3 -type f -name "*.zip" -print
            exit 1
          fi

          echo "SOURCE ZIP:"
          echo "$ZIP"

          ls -lh "$ZIP"

          unzip -t "$ZIP" >/dev/null

          echo "ZIP integrity: OK"

          echo "BUILD_SOURCE=ZIP" >> "$GITHUB_ENV"
          echo "SOURCE_ZIP=$ZIP" >> "$GITHUB_ENV"

      # 8. Extract source ZIP when necessary
      - name: Extract source project
        if: env.BUILD_SOURCE == 'ZIP'
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "EXTRACTING SOURCE PROJECT"
          echo "========================================"

          rm -rf project
          mkdir -p project

          unzip -q "$SOURCE_ZIP" -d project

          echo "Extraction completed."

          echo ""
          echo "Searching for Gradle project root..."

          SETTINGS_FILE=$(find project -maxdepth 8 \
            \( -name "settings.gradle.kts" -o -name "settings.gradle" \) \
            -print -quit)

          if [ -z "$SETTINGS_FILE" ]; then
            echo "ERROR: settings.gradle(.kts) not found."

            echo ""
            echo "Extracted files:"
            find project -maxdepth 6 -type f | head -250

            exit 1
          fi

          ROOT_DIR=$(dirname "$SETTINGS_FILE")

          echo "Detected Gradle root:"
          echo "$ROOT_DIR"

          if [ "$ROOT_DIR" != "project" ]; then

            rm -rf project_root
            mkdir -p project_root

            shopt -s dotglob

            cp -R "$ROOT_DIR"/. project_root/

            rm -rf project
            mv project_root project
          fi

          echo ""
          echo "FINAL PROJECT ROOT:"
          ls -lah project

      # 9. Prepare direct repository project
      - name: Prepare direct project
        if: env.BUILD_SOURCE == 'ROOT'
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "USING PROJECT FROM REPOSITORY ROOT"
          echo "========================================"

          rm -rf project
          mkdir -p project

          shopt -s dotglob
          cp -R . project/

          rm -rf project/project

          echo "Project copied successfully."

      # 10. Verify Gradle project
      - name: Verify Gradle project
        shell: bash
        run: |
          set -e

          echo "========================================"
          echo "VERIFYING GRADLE PROJECT"
          echo "========================================"

          test -f project/settings.gradle.kts || \
          test -f project/settings.gradle

          test -f project/build.gradle.kts || \
          test -f project/build.gradle

          test -d project/app

          echo "Gradle project verification: PASSED"

          echo ""
          echo "Project files:"
          ls -lah project

          echo ""
          echo "App:"
          ls -lah project/app

      # 11. Gradle wrapper
      - name: Check Gradle wrapper
        shell: bash
        run: |
          set -e

          cd project

          echo "========================================"
          echo "CHECKING GRADLE WRAPPER"
          echo "========================================"

          if [ -f "./gradlew" ]; then

            chmod +x ./gradlew

            echo "gradlew found."
            echo "gradlew executable: OK"

            ./gradlew --version || true

          else

            echo "gradlew not found."
            echo "Using Gradle 8.10 supplied by setup-gradle."

            gradle --version

          fi

      # 12. Verify Room
      - name: Verify Room database structure
        shell: bash
        run: |
          set -e

          cd project

          echo "========================================"
          echo "VERIFYING ROOM DATABASE STRUCTURE"
          echo "========================================"

          DB="app/src/main/java/com/pharmamentor/app/data/AppDatabase.kt"

          if [ ! -f "$DB" ]; then
            echo "ERROR: AppDatabase.kt not found:"
            echo "$DB"
            exit 1
          fi

          echo "AppDatabase.kt: FOUND"

          echo ""
          echo "Room database declaration:"
          grep -n "@Database" "$DB" || true

          echo ""
          echo "Room entities:"
          grep -n "Entity::class" "$DB" || true

          echo ""
          echo "Database version:"
          grep -n "version" "$DB" || true

          echo ""
          echo "Checking entity files..."

          ENTITY_COUNT=$(find app/src/main/java \
            -type f \
            -name "*.kt" \
            -exec grep -l "@Entity" {} \; | wc -l)

          echo "Detected Room entity files: $ENTITY_COUNT"

          if [ "$ENTITY_COUNT" -eq 0 ]; then
            echo "ERROR: No @Entity declarations detected."
            exit 1
          fi

          echo ""
          echo "ROOM STRUCTURE CHECK: PASSED"

      # 13. Verify comprehensive drug library
      - name: Verify comprehensive drug library
        shell: bash
        run: |
          set -e

          cd project

          echo "========================================"
          echo "VERIFYING COMPREHENSIVE DRUG LIBRARY"
          echo "========================================"

          SEED="app/src/main/java/com/pharmamentor/app/data/ComprehensiveDrugSeed.kt"

          if [ ! -f "$SEED" ]; then
            echo "WARNING: ComprehensiveDrugSeed.kt not found."
            echo "Continuing because the project may use another library source."
            exit 0
          fi

          echo "Library file: FOUND"

          COUNT=$(grep -oE 'd\("[^"]+"' "$SEED" | wc -l)

          echo "Drug entries detected: $COUNT"

          if [ "$COUNT" -lt 212 ]; then
            echo "ERROR: Drug library contains fewer than 212 entries."
            exit 1
          fi

          if [ "$COUNT" -lt 500 ]; then
            echo "WARNING: Drug library contains fewer than 500 entries."
          fi

          echo "Comprehensive drug library check: PASSED"

      # 14. Verify Gradle configuration
      - name: Verify Gradle configuration
        shell: bash
        run: |
          set -e

          cd project

          echo "========================================"
          echo "GRADLE CONFIGURATION"
          echo "========================================"

          java -version

          echo ""
          echo "Gradle:"
          gradle --version

          echo ""
          echo "Root files:"
          ls -lah

      # 15. Clean
      - name: Gradle clean
        shell: bash
        run: |
          set -e

          cd project

          echo "========================================"
          echo "GRADLE CLEAN"
          echo "========================================"

          if [ -f "./gradlew" ]; then
            ./gradlew \
              --no-daemon \
              --stacktrace \
              clean
          else
            gradle \
              --no-daemon \
              --stacktrace \
              clean
          fi

      # 16. Build Debug APK
      - name: Build Debug APK
        shell: bash
        run: |
          set -e

          cd project

          echo "========================================"
          echo "BUILDING PHARMA MENTOR APK"
          echo "========================================"

          if [ -f "./gradlew" ]; then

            ./gradlew \
              --no-daemon \
              --stacktrace \
              :app:assembleDebug

          else

            gradle \
              --no-daemon \
              --stacktrace \
              :app:assembleDebug

          fi

      # 17. Verify APK
      - name: Verify APK
        shell: bash
        run: |
          set -e

          cd project

          APK="app/build/outputs/apk/debug/app-debug.apk"

          if [ ! -f "$APK" ]; then
            echo "ERROR: APK was not generated."

            echo ""
            echo "APK search:"
            find app/build -type f 2>/dev/null | sort || true

            exit 1
          fi

          echo "========================================"
          echo "APK BUILD: SUCCESS"
          echo "========================================"

          ls -lh "$APK"

          echo ""
          echo "SHA256:"
          sha256sum "$APK"

      # 18. Upload APK
      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: PharmaMentor-V51-Debug-APK
          path: project/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 14
